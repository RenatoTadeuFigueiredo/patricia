<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Página não encontrada | Patrícia Sena</title>
  <meta name="robots" content="noindex, follow">

  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <meta name="theme-color" content="#7a58be">

  <link rel="stylesheet" href="/style.css" />

  <style>
    .not-found {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem 1.5rem;
      gap: 1rem;
    }

    .not-found-code {
      font-size: 4rem;
      font-weight: 700;
      line-height: 1;
      color: var(--primary);
      margin: 0;
    }

    .not-found h1 {
      font-size: 1.5rem;
      margin: 0;
    }

    .not-found p {
      max-width: 34rem;
      margin: 0;
      color: var(--text-soft);
    }

    .not-found .btn {
      margin-top: 0.5rem;
    }
  </style>
</head>
<body>
  <main class="not-found">
    <p class="not-found-code" aria-hidden="true">404</p>
    <h1>Esta página não existe</h1>
    <p>
      O endereço que você tentou acessar não foi encontrado. Talvez o link esteja
      desatualizado ou tenha sido digitado com algum erro.
    </p>
    <a href="/" class="btn btn-primary">Voltar para a página inicial</a>
  </main>
</body>
</html>
